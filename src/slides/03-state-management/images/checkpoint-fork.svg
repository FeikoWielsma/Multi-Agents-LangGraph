<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc"><title id="title">Forking a checkpoint</title><desc id="desc">A new continuation branches from a saved state before record while the original execution remains.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1F5D9C"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#D94C2F"/></marker></defs><rect width="1100" height="430" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="10" y="28" font-size="23" fill="#1F5D9C" font-weight="600">Original execution</text><rect x="15" y="65" width="300" height="85" rx="5" fill="#EEF3F9" stroke="#1F5D9C" stroke-width="2"/><text x="33" y="98" font-size="22" fill="#0F1729" font-weight="400">Checkpoint A</text><text x="33" y="129" font-size="22" fill="#0F1729" font-weight="400">Request received</text><rect x="390" y="65" width="300" height="85" rx="5" fill="#EEF3F9" stroke="#1F5D9C" stroke-width="2"/><text x="408" y="98" font-size="22" fill="#0F1729" font-weight="400">Checkpoint B</text><text x="408" y="129" font-size="22" fill="#0F1729" font-weight="400">Before record</text><rect x="765" y="65" width="300" height="85" rx="5" fill="#EEF3F9" stroke="#1F5D9C" stroke-width="2"/><text x="783" y="98" font-size="22" fill="#0F1729" font-weight="400">Checkpoint C</text><text x="783" y="129" font-size="22" fill="#0F1729" font-weight="400">Original draft recorded</text><path d="M315 105H384" fill="none" stroke="#1F5D9C" stroke-width="3" marker-end="url(#blue)"/><path d="M690 105H759" fill="none" stroke="#1F5D9C" stroke-width="3" marker-end="url(#blue)"/><path d="M540 150V275H760" fill="none" stroke="#1F5D9C" stroke-width="3" marker-end="url(#blue)"/><text x="18" y="246" font-size="24" fill="#2A8AA8" font-weight="600">Fork from B</text><text x="18" y="282" font-size="22" fill="#0F1729" font-weight="400">Change the draft in saved state</text><text x="18" y="313" font-size="22" fill="#0F1729" font-weight="400">Keep the original history</text><rect x="765" y="235" width="300" height="105" rx="5" fill="#E9F5F7" stroke="#2A8AA8" stroke-width="2"/><text x="783" y="271" font-size="22" fill="#0F1729" font-weight="400">New continuation</text><text x="783" y="302" font-size="22" fill="#0F1729" font-weight="400">Record runs again</text><text x="15" y="397" font-size="22" fill="#637082" font-weight="400">The fork reuses a checkpoint ; it is not a rollback of external actions</text></g></svg>

