<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc"><title id="title">Merging state updates</title><desc id="desc">Sequential overwrite replaces earlier notes; parallel concatenation keeps both; concurrent writes without a reducer fail.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1F5D9C"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#D94C2F"/></marker></defs><rect width="1100" height="430" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="10" y="30" font-size="24" fill="#1F5D9C" font-weight="600">Sequential overwrite</text><text x="380" y="30" font-size="24" fill="#1F5D9C" font-weight="600">Parallel concatenation</text><text x="750" y="30" font-size="24" fill="#1F5D9C" font-weight="600">Parallel without reducer</text><rect x="10" y="60" width="330" height="62" rx="5" fill="#EEF3F9" stroke="#1F5D9C" stroke-width="2"/><text x="25" y="99" font-size="22" fill="#0F1729" font-weight="400">notes = ["inspect door"]</text><path d="M175 122V159" fill="none" stroke="#1F5D9C" stroke-width="3" marker-end="url(#blue)"/><rect x="10" y="162" width="330" height="62" rx="5" fill="#EEF3F9" stroke="#1F5D9C" stroke-width="2"/><text x="25" y="201" font-size="22" fill="#0F1729" font-weight="400">update = ["check stock"]</text><path d="M175 224V268" fill="none" stroke="#1F5D9C" stroke-width="3" marker-end="url(#blue)"/><rect x="10" y="272" width="330" height="90" rx="5" fill="#E9F5F7" stroke="#2A8AA8" stroke-width="2"/><text x="25" y="307" font-size="22" fill="#0F1729" font-weight="400">notes =</text><text x="25" y="338" font-size="22" fill="#0F1729" font-weight="400">["check stock"]</text><rect x="380" y="60" width="152" height="83" rx="5" fill="#EEF3F9" stroke="#1F5D9C" stroke-width="2"/><text x="390" y="93" font-size="21" fill="#0F1729" font-weight="400">Branch A</text><text x="390" y="123" font-size="21" fill="#0F1729" font-weight="400">["door"]</text><rect x="557" y="60" width="153" height="83" rx="5" fill="#EEF3F9" stroke="#1F5D9C" stroke-width="2"/><text x="567" y="93" font-size="21" fill="#0F1729" font-weight="400">Branch B</text><text x="567" y="123" font-size="21" fill="#0F1729" font-weight="400">["stock"]</text><path d="M455 143V190H544V235" fill="none" stroke="#1F5D9C" stroke-width="3" marker-end="url(#blue)"/><path d="M633 143V190H544V235" fill="none" stroke="#1F5D9C" stroke-width="3" marker-end="url(#blue)"/><rect x="750" y="60" width="152" height="83" rx="5" fill="#EEF3F9" stroke="#1F5D9C" stroke-width="2"/><text x="760" y="93" font-size="21" fill="#0F1729" font-weight="400">Branch A</text><text x="760" y="123" font-size="21" fill="#0F1729" font-weight="400">["door"]</text><rect x="927" y="60" width="153" height="83" rx="5" fill="#EEF3F9" stroke="#1F5D9C" stroke-width="2"/><text x="937" y="93" font-size="21" fill="#0F1729" font-weight="400">Branch B</text><text x="937" y="123" font-size="21" fill="#0F1729" font-weight="400">["stock"]</text><path d="M825 143V190H914V235" fill="none" stroke="#1F5D9C" stroke-width="3" marker-end="url(#blue)"/><path d="M1003 143V190H914V235" fill="none" stroke="#1F5D9C" stroke-width="3" marker-end="url(#blue)"/><rect x="380" y="239" width="330" height="123" rx="5" fill="#E9F5F7" stroke="#2A8AA8" stroke-width="2"/><text x="395" y="275" font-size="22" fill="#0F1729" font-weight="400">operator.add</text><text x="395" y="306" font-size="22" fill="#0F1729" font-weight="400">["door", "stock"]</text><text x="395" y="337" font-size="22" fill="#0F1729" font-weight="400">Both updates kept</text><rect x="750" y="239" width="330" height="123" rx="5" fill="#FFF2ED" stroke="#D94C2F" stroke-width="2"/><text x="765" y="275" font-size="22" fill="#0F1729" font-weight="400">InvalidUpdateError</text><text x="765" y="306" font-size="22" fill="#0F1729" font-weight="400">Concurrent writes</text><text x="765" y="337" font-size="22" fill="#0F1729" font-weight="400">need a merge policy</text><text x="10" y="403" font-size="21" fill="#637082" font-weight="400">Illustrative state values ; concatenation order is not a business priority</text></g></svg>
