<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="455" viewBox="0 0 1100 455" role="img" aria-labelledby="title desc"><title id="title">Finding the first divergence</title><desc id="desc">Two schematic traces diverge when one reads the bus firmware and the other skips the lookup. An answer with a real bulletin citation can still apply the wrong interval.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1F5D9C"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#D94C2F"/></marker></defs><rect width="1100" height="455" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="12" y="30" font-size="24" fill="#1F5D9C" font-weight="600">Same question: fan interval for CE12-2023-0342</text><text x="12" y="62" font-size="20" fill="#637082" font-weight="400">Illustrative comparison using the fixture firmware 5.1</text><text x="12" y="112" font-size="24" fill="#2A8AA8" font-weight="600">Lookup included</text><rect x="12" y="140" width="520" height="60" rx="5" fill="#FFF7E8" stroke="#D94C2F" stroke-width="2"/><text x="32" y="178" font-size="22" fill="#0F1729" font-weight="400">bus_info → firmware 5.1</text><path d="M272 200V221" fill="none" stroke="#1F5D9C" stroke-width="3" marker-end="url(#blue)"/><rect x="12" y="227" width="520" height="60" rx="5" fill="#EEF3F9" stroke="#CBD5E1" stroke-width="2"/><text x="32" y="265" font-size="22" fill="#0F1729" font-weight="400">search → manual and bulletin</text><path d="M272 287V308" fill="none" stroke="#1F5D9C" stroke-width="3" marker-end="url(#blue)"/><rect x="12" y="314" width="520" height="60" rx="5" fill="#EEF3F9" stroke="#CBD5E1" stroke-width="2"/><text x="32" y="352" font-size="22" fill="#0F1729" font-weight="400">answer → every 12 months</text><text x="568" y="112" font-size="24" fill="#D94C2F" font-weight="600">Lookup skipped</text><rect x="568" y="140" width="520" height="60" rx="5" fill="#FFF7E8" stroke="#D94C2F" stroke-width="2"/><text x="588" y="178" font-size="22" fill="#0F1729" font-weight="400">search → bulletin only</text><path d="M828 200V221" fill="none" stroke="#1F5D9C" stroke-width="3" marker-end="url(#blue)"/><rect x="568" y="227" width="520" height="60" rx="5" fill="#EEF3F9" stroke="#CBD5E1" stroke-width="2"/><text x="588" y="265" font-size="22" fill="#0F1729" font-weight="400">context → firmware unknown</text><path d="M828 287V308" fill="none" stroke="#1F5D9C" stroke-width="3" marker-end="url(#blue)"/><rect x="568" y="314" width="520" height="60" rx="5" fill="#EEF3F9" stroke="#CBD5E1" stroke-width="2"/><text x="588" y="352" font-size="22" fill="#0F1729" font-weight="400">answer → every 18 months</text><text x="12" y="427" font-size="22" fill="#D94C2F" font-weight="400">Start at the first divergence: the second run never obtains the bus firmware</text></g></svg>
